<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Camera Alert</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        h2 {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border-radius: 6px;
        }

        table {
            width: 100%;

        }

        tr:nth-child(even) {
