{% include 'admin_header.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Train</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f7;
    padding: 30px;
}
h2 {
    text-align: center;
    background-color: #2c3e50;
    color: white;
    padding: 12px;
    border-radius: 5px;
    margin-bottom: 20px;
}
form {
    width: 40%;
    margin: auto;
    background-color: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 10px gray;
}
label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
}
input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

input[type="submit"] {
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    font-size: 15px;
    border: none;
    cursor: pointer;
    color: white;
    background-color: #2c3e50;
    border-radius: 5px;
}
table {
    width: 80%;
    margin: 40px auto;
    border-collapse: collapse;
    background-color: white;
}
th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}
th {
    background-color: #2c3e50;
    color: white;
}
.edit-btn {
    background-color: #2980b9;
    color: white;
    padding: 5px 8px;
}
.delete-btn {
    background-color: #c0392b;
    color: white;
    padding: 5px 8px;
}

.message {
    width: 40%;
    margin: 10px auto;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
}
.success { background-color: #2ecc71; color: white; }
.error { background-color: #e74c3c; color: white; }
</style>
</head>

<body>

<h2>Edit Train Details</h2>

<form method="post">
    {% csrf_token %}

    <label>Train Name</label>
    <input type="text" name="trainname" required>

    <label>Train Number</label>
    <input type="number" step="any" name="trainnumber" required>

    <label>Starting Station</label>
    <input type="text" step="any" name="startingstation" required>

     <label>Ending Station</label>
    <input type="text" step="any" name="endingstation" required>

    <input type="submit" value="Submit">
</form>
</body>
</html>
{% include 'admin_footer.html' %}
