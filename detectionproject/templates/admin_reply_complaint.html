{% include 'admin_header.html' %}
<!DOCTYPE html>
<html>
<head>
    <title>Reply Complaint</title>

    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            padding: 30px;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
        }

        .box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            width: 500px;
            margin: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .box:hover {
            transform: translateY(-4px);
        }

        h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        p {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
            font-size: 14px;
            margin-bottom: 10px;
        }

        strong {
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
            margin-top: 5px;
        }

        textarea:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52,152,219,0.4);
        }

        label {
            font-weight: 600;
            color: #34495e;
        }

        button {
            background: linear-gradient(to right, #2c3e50, #34495e);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: linear-gradient(to right, #1a252f, #2c3e50);
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<div class="box">
    <h3>Reply to Complaint</h3>

    <p><strong>Complaint:</strong> {{ complaint.complaint }}</p>
    <p><strong>Date:</strong> {{ complaint.date }}</p>

    <form method="POST">
        {% csrf_token %}
        <label>Reply:</label><br>
        <textarea name="reply" required>{{ complaint.reply }}</textarea><br><br>
        <button type="submit">Send Reply</button>
    </form>
</div>

</body>
</html>
