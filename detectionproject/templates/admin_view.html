{% include 'admin_header.html' %}

<!DOCTYPE html>
<html>
<head>
    <title>Admin - View Complaints</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .btn {
            padding: 5px 10px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
        }
        .edit {
            background-color: green;
        }
        .delete {
            background-color: red;
        }
    </style>
</head>
<body>

<h2>Complaint List</h2>

<table>
    <tr>
        <th>Loco Pilot</th>
        <th>Complaint</th>
        <th>Reply</th>
        <th>Date</th>
        <th>Action</th>
    </tr>

    {% for c in complaints %}
    <tr>
        <td>{{ c.loco_pilot }}</td>
        <td>{{ c.complaint }}</td>
        <td>
            {% if c.reply %}
                {{ c.reply }}
            {% else %}
                Pending
            {% endif %}
        </td>
        <td>{{ c.date }}</td>
        <td>
            <a href="{% url 'edit_complaint' c.id %}" class="btn edit">Edit</a>
            <a href="{% url 'delete_complaint' c.id %}" class="btn delete"
               onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
