{% include 'header.html' %}
<br><br><br>

<style>

body{
background:#0d1117;
color:white;
font-family: Arial, sans-serif;
}

/* Container */

.container{
text-align:center;
margin-top:50px;
}

/* Login box */

.login-box{
background: rgba(255,255,255,0.04);
backdrop-filter: blur(12px);
width:350px;
margin:auto;
padding:35px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

/* Title */

h3{
margin:15px 0 20px 0;
font-size:22px;
letter-spacing:1px;
}

/* Inputs */

input[type="text"],
input[type="password"]{

width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid rgba(255,255,255,0.15);
background:#161b22;
color:white;
}

input::placeholder{
color:#aaa;
}

/* Button */

button{
width:100%;
padding:12px;
margin-top:10px;
background: linear-gradient(135deg,#ff8c00,#ff5e00);
color:white;
border:none;
border-radius:6px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

/* Options */

.options{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:13px;
color:#aaa;
}

.options a{
text-decoration:none;
color:#00c6ff;
}

.options a:hover{
text-decoration:underline;
}

label{
display:flex;
align-items:center;
gap:5px;
}

</style>

<div class="container">

<div class="login-box">

<h3>TrackShield Login</h3>

<form method="POST">

{% csrf_token %}

<input type="text" placeholder="Username" name="username" required>

<input type="password" placeholder="Password" name="password" required>

<button type="submit">Login</button>

<div class="options">

<label>
<input type="checkbox" checked> Remember Me
</label>

<a href="#">Forgot Password</a>

</div>

</form>

</div>

</div>

<br>
