{% include 'admin_header.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Locopilot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f7;
            padding: 30px;
        }

        h2 {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        form {
            width: 50%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px gray;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            margin-top: 20px;
            padding: 10px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            color: white;
            background-color: #2c3e50;
            width: 100%;
        }

        input[type="submit"]:hover {
            opacity: 0.9;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            box-shadow: 0 0 10px #ccc;
            background-color: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
        .action-cell {
            white-space: nowrap;
        }


.edit-btn, .delete-btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    border: 1px solid black;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 4px;
    width: 65px;
    text-align: center;
}

.edit-btn {
    background-color: #3498db;
}

.delete-btn {
    background-color: #e74c3c;
}

.edit-btn:hover {
    background-color: #2980b9;
}

.delete-btn:hover {
    background-color: #c0392b;
}
</style>

</head>
<body>

<h2>Add Locopilot</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="post">
{% csrf_token %}

<label>Train Name</label>
<select name="train" required>
<option value="">-- Select Train --</option>

{% for t in trains %}
<option value="{{ t.id }}" {% if locopilot.TRAIN.id == t.id %}selected{% endif %}>
{{ t.trainname }}
</option>
{% endfor %}

</select>

<label>Name</label>
<input type="text" name="name" value="{{ locopilot.name }}" required>

<label>Station Name</label>
<input type="text" name="stationname" value="{{ locopilot.stationname }}" required>

<label>Place</label>
<input type="text" name="place" value="{{ locopilot.place }}" required>

<label>Phone</label>
<input type="tel" name="phone" value="{{ locopilot.phone }}" pattern="[0-9]{10}" required>

<label>Email</label>
<input type="email" name="email" value="{{ locopilot.Email }}" required>

<label>Username</label>
<input type="text" name="username" value="{{ locopilot.USER.username }}" required>

<label>New Password (leave blank to keep old)</label>
<input type="password" name="password">

<input type="submit" value="Update Locopilot">

</form>
</body>
</html>
{% include 'admin_footer.html' %}
