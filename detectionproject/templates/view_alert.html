<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Railway Alert Notifications</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:#f4f6f7;
    padding:20px;
}

h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

table{
    width:90%;
    margin:auto;
    border-collapse:collapse;
    background-color:white;
    box-shadow:0 0 10px #ccc;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background-color:#2c3e50;
    color:white;
}

tr:nth-child(even){
    background-color:#f9f9f9;
}

tr:hover{
    background-color:#f1f1f1;
}

img{
    width:150px;
    border-radius:5px;
}

.no-data{
    text-align:center;
    padding:20px;
}

</style>

</head>

<body>

<h2>Railway Foreign Object Alerts</h2>

<table>

<tr>

<th>Camera</th>
<th>Image</th>
<th>Description</th>
<th>Date</th>

</tr>

{% for a in alerts %}

<tr>

<td>{{a.CAMERA.cameraname}}</td>

<td>

<img src="{{a.Image.url}}">

</td>

<td>{{a.description}}</td>

<td>{{a.date}}</td>

</tr>

{% empty %}

<tr>

<td colspan="4" class="no-data">
No Alerts Found
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
